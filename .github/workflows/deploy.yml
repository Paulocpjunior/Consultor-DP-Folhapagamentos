name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico para o version.json listar as novidades do aviso de atualização.
          fetch-depth: 60
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Tipos e testes antes do build: PR com erro de tipo ou teste quebrado fica vermelho.
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build with Vite
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Gate de departamento em BLOQUEIO (Paulo, 08/08, após teste):
          # app estático — o modo entra no build.
          VITE_DEPARTAMENTO_GATE_MODO: bloqueio
          # Serviços externos (services/plataforma/servicos.ts): vazios = CFI de sempre. Variáveis do repositório,
          # não segredos — são endereços públicos; quem autoriza é o token do usuário.
          VITE_PLATAFORMA_URL: ${{ vars.VITE_PLATAFORMA_URL }}
          VITE_SERVICO_CADASTRO_URL: ${{ vars.VITE_SERVICO_CADASTRO_URL }}
          VITE_SERVICO_COFRE_URL: ${{ vars.VITE_SERVICO_COFRE_URL }}
          VITE_SERVICO_GOVERNO_URL: ${{ vars.VITE_SERVICO_GOVERNO_URL }}
          VITE_SERVICO_EMAIL_URL: ${{ vars.VITE_SERVICO_EMAIL_URL }}
          VITE_SERVICO_WHATSAPP_URL: ${{ vars.VITE_SERVICO_WHATSAPP_URL }}
          VITE_SERVICO_IA_URL: ${{ vars.VITE_SERVICO_IA_URL }}
          VITE_PAINEL_MENSAGENS_URL: ${{ vars.VITE_PAINEL_MENSAGENS_URL }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Regras do Firestore e do Storage no emulador: acesso por carteira, auditoria, ids das empresas (auditoria de 10/2026).
  regras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java (emulador)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Testes das regras
        run: npm run test:regras

  # Publica as regras do Firestore depois dos testes delas, a cada push na main (ou pelo "Run workflow"). Precisa do
  # segredo FIREBASE_SERVICE_ACCOUNT: a chave JSON de uma conta de serviço do projeto com o papel "Administrador de
  # regras do Firebase". Sem ele, o passo só avisa (as regras continuam as publicadas pelo console).
  publicar-regras:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: regras
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/checkout@v5
      - name: Setup Node.js
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publicar as regras do Firestore
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/conta.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json" npx --yes firebase-tools@14 deploy --only firestore:rules --project consultor-dp-folha --non-interactive
          rm -f "$RUNNER_TEMP/conta.json"
      - name: Sem a credencial
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::Segredo FIREBASE_SERVICE_ACCOUNT ausente - as regras do Firestore nao foram publicadas (publique pelo console)."

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
